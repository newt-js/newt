# Publishes newt's site (web/) on GitHub Pages on every push to main that touches it.
name: Deploy the site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Where the site lives. With a domain pointing at Pages: SITE_URL=https://<domain> and BASE_PATH=/
  SITE_URL: https://newt-js.github.io
  BASE_PATH: /newt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Astro runs on Node, 22.23.4 or later.
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --cwd web build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
