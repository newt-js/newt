# Every push and pull request: types, tests, lint, check-packs and a dry run of the publish.
name: CI

on:
  push:
    branches: ['main', 'newt-cli/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The tests of Postgres, MySQL, Valkey and S3 run against these, never skipped. A fresh MySQL
    # takes root's password over TLS alone; newt's text needs a database of LOCALE C.
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
      MYSQL_TEST_URL: mysql://root:root@localhost:3306/mysql?sslmode=require
      VALKEY_URL: redis://localhost:6379
      S3_TEST_URL: http://newt:newt-secret@localhost:9000/newt-test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd "mysql -uroot -proot -h127.0.0.1 -e 'SELECT 1'" --health-interval 2s --health-retries 60
      valkey:
        image: valkey/valkey:8
        ports: ['6379:6379']
        options: --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
    steps:
      # MinIO needs a command, which a service cannot take. The image carries mc, which makes the bucket.
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=newt -e MINIO_ROOT_PASSWORD=newt-secret pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          timeout 60 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
          docker exec minio mc alias set local http://localhost:9000 newt newt-secret
          docker exec minio mc mb local/newt-test
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun tools/release/publish.ts
