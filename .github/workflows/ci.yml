# Every push and pull request: types, tests, lint, check-packs and a dry run of the publish.
name: CI

on:
  push:
    branches: ['main', 'newt-cli/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun tools/release/publish.ts
